# Static build on GitHub Pages: https://gtsulaia09.github.io/bimmercode/
# scripts/build-pages.mjs builds _site/ with rebased paths under /bimmercode, per-code JSON files,
# 404.html dynamic /code/<ID> rendering, and a localStorage-backed serverless API runtime (js/demo-shim.js).
# Production deploys run automatically on Cloudflare Pages (https://bimmercodes.net) from main.
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
