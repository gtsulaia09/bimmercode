# Static demo on GitHub Pages: https://gtsulaia09.github.io/bimmercode/
# scripts/build-pages.mjs builds _site/: the site with paths under /bimmercode, one JSON file per trouble code, code
# pages rendered in the browser (404.html), and a shim that answers /api with "not available in the demo" — forum,
# sign-in, AI assistant and admin need Cloudflare (Functions, D1, R2). Production deploys are unchanged.
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
